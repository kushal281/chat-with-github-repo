<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Repo Chat</title>
    <style>
      :root {
        --bg: #f6f8fa;
        --surface: #ffffff;
        --border: #d8dee4;
        --text: #1f2328;
        --muted: #656d76;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --accent-soft: #eef2ff;
        --danger: #cf222e;
        --code-bg: #f0f2f5;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 6px 16px rgba(0, 0, 0, 0.05);
        --radius: 12px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --surface: #161b22;
          --border: #30363d;
          --text: #e6edf3;
          --muted: #8b949e;
          --accent: #6366f1;
          --accent-hover: #7c7ff5;
          --accent-soft: #1d2140;
          --danger: #ff7b72;
          --code-bg: #1f2630;
          --shadow: none;
        }
      }

      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--text);
        max-width: 820px;
        margin: 0 auto;
        padding: 2.5rem 1rem 4rem;
        line-height: 1.5;
      }

      .hero {
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.25rem;
        letter-spacing: -0.02em;
      }
      .subtitle {
        margin: 0;
        color: var(--muted);
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1rem;
        margin-bottom: 1rem;
      }

      .row {
        display: flex;
        gap: 0.5rem;
      }
      input {
        flex: 1;
        padding: 0.7rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button {
        padding: 0.7rem 1.1rem;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #status {
        margin-top: 0.75rem;
        font-size: 0.9rem;
        color: var(--muted);
        min-height: 1.2rem;
      }
      #status.failed {
        color: var(--danger);
      }

      #messages {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        min-height: 160px;
        margin-bottom: 1rem;
      }

      .msg {
        max-width: 88%;
        padding: 0.75rem 1rem;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .msg p {
        margin: 0.4rem 0;
      }
      .msg ul {
        margin: 0.4rem 0;
        padding-left: 1.2rem;
      }
      .user {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
        border-radius: 16px 16px 4px 16px;
      }
      .bot {
        align-self: flex-start;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 16px 16px 16px 4px;
      }

      .msg code {
        background: var(--code-bg);
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 0.85em;
      }
      .msg pre {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.7rem;
        overflow-x: auto;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 0.8rem;
        white-space: pre;
      }
      .msg pre code {
        background: none;
        padding: 0;
      }

      .cite {
        display: inline-block;
        min-width: 1.2rem;
        text-align: center;
        background: var(--accent-soft);
        color: var(--accent);
        border-radius: 10px;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0 0.35rem;
        margin: 0 0.1rem;
        text-decoration: none;
        vertical-align: super;
      }
      [data-theme] .cite {
        color: var(--accent);
      }

      .sources {
        margin-top: 0.75rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--border);
        font-size: 0.85rem;
      }
      .sources > summary,
      .sources-title {
        cursor: pointer;
        font-weight: 600;
      }
      .sources summary {
        padding: 0.2rem 0;
        cursor: pointer;
      }
      .sources summary .cite {
        vertical-align: baseline;
        margin-right: 0.4rem;
      }
      .sources a {
        color: var(--accent);
        text-decoration: none;
      }
      .sources a:hover {
        text-decoration: underline;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .chip {
        background: var(--surface);
        color: var(--accent);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.35rem 0.8rem;
        font-size: 0.82rem;
        font-weight: 500;
      }
      .chip:hover:not(:disabled) {
        background: var(--accent-soft);
      }

      @media (max-width: 520px) {
        body {
          padding-top: 1.25rem;
        }
        .msg {
          max-width: 95%;
        }
      }

      /* ---------- layout states ---------- */
      body {
        max-width: none;
        margin: 0;
        padding: 0;
      }
      #uploadCard {
        view-transition-name: upload;
      }

      .brand {
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .intro h2 {
        margin: 0 0 0.25rem;
        font-size: 1.4rem;
        letter-spacing: -0.02em;
      }
      .intro p {
        margin: 0 0 1rem;
        color: var(--muted);
      }

      .info-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }
      #repoName {
        display: block;
        margin: 0.2rem 0;
        font-weight: 600;
        color: var(--accent);
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      #repoName:hover {
        text-decoration: underline;
      }
      #repoMeta {
        font-size: 0.85rem;
        color: var(--muted);
      }

      /* LANDING: upload card centered, title top-left */
      body.landing {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      body.landing aside {
        width: 100%;
        max-width: 560px;
      }
      body.landing main,
      body.landing #repoInfo {
        display: none;
      }

      /* READY: sidebar + chat column */
      body.ready {
        height: 100dvh;
        overflow: hidden;
        display: grid;
        grid-template-columns: 300px 1fr;
      }
      body.ready aside {
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        overflow-y: auto;
      }
      body.ready .intro {
        display: none;
      }
      body.ready #uploadCard {
        padding: 0;
        border: 0;
        box-shadow: none;
        background: none;
        margin: 0;
      }
      body.ready #uploadCard .row {
        flex-direction: column;
      }
      body.ready #repoInfo {
        margin: 0;
        background: var(--bg);
        box-shadow: none;
      }

      body.ready main {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      body.ready #messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        width: 100%;
        max-width: 820px;
        margin: 0 auto;
        padding: 1.5rem 1rem;
      }
      .composer {
        border-top: 1px solid var(--border);
        background: var(--surface);
        padding: 1rem;
      }
      .composer .row {
        max-width: 820px;
        margin: 0 auto;
      }

      @media (max-width: 760px) {
        body.ready {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }
        body.ready aside {
          border-right: 0;
          border-bottom: 1px solid var(--border);
          padding: 0.75rem;
          gap: 0.5rem;
          max-height: 40dvh;
        }
        body.ready #uploadCard .row {
          flex-direction: row;
        }
      }
      .brand {
        view-transition-name: brand;
      }

      body.landing aside {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      body.landing .brand {
        text-align: center;
        font-size: clamp(2rem, 6vw, 3.25rem);
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      body.ready .brand {
        font-size: 1.15rem;
        font-weight: 700;
      }
      body.landing aside {
        max-width: 780px;
      }
      body.landing .brand {
        white-space: nowrap;
      }
      body.landing #uploadCard {
        padding: 1.75rem 2rem;
      }
      body.landing .intro h2 {
        font-size: 1.5rem;
      }
      body.landing .intro p {
        font-size: 1.05rem;
        margin-bottom: 1.25rem;
      }
      body.landing input {
        padding: 0.9rem 1.1rem;
        font-size: 1.05rem;
      }
      body.landing button {
        padding: 0.9rem 1.6rem;
        font-size: 1.05rem;
      }
      #status:empty {
        display: none;
      }
      @media (max-width: 820px) {
        body.landing .brand {
          white-space: normal;
        }
      }
      body.landing aside {
        gap: 6rem;
      }

      .stepper {
        list-style: none;
        display: flex;
        gap: 0.5rem;
        margin: 1.25rem 0 0;
        padding: 0;
      }
      .stepper[hidden] {
        display: none;
      }
      .stepper li {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .stepper li:not(:last-child)::after {
        content: "";
        flex: 1;
        height: 2px;
        background: var(--border);
        margin-left: 0.25rem;
      }
      .stepper .dot {
        width: 1.4rem;
        height: 1.4rem;
        flex: none;
        border-radius: 50%;
        border: 2px solid var(--border);
        display: grid;
        place-items: center;
        font-size: 0.7rem;
        font-weight: 700;
      }

      .stepper li.active {
        color: var(--text);
        font-weight: 600;
      }
      .stepper li.active .dot {
        border-color: var(--accent);
        border-top-color: transparent;
        animation: spin 0.8s linear infinite;
      }
      .stepper li.done .dot {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .stepper li.done .dot::before {
        content: "\2713";
      }
      .stepper li.done::after {
        background: var(--accent);
      }
      .stepper li.error {
        color: var(--danger);
        font-weight: 600;
      }
      .stepper li.error .dot {
        border-color: var(--danger);
        color: var(--danger);
      }
      .stepper li.error .dot::before {
        content: "!";
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      body.ready .stepper {
        flex-direction: column;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }
      body.ready .stepper li::after {
        display: none;
      }

      #status.failed {
        background: color-mix(in srgb, var(--danger) 12%, transparent);
        border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
      }

      .composer {
        border-top: 0;
        background: transparent;
        padding: 0 1rem 1.25rem;
      }
      .composer .row {
        max-width: 820px;
        margin: 0 auto;
        padding: 0.7rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      }
      .composer input,
      .composer button {
        border-radius: 14px;
      }

      .composer {
        view-transition-name: composer;
      }
      #chips {
        margin-top: 1.25rem;
        justify-content: center;
      }
      main:not(.empty) #chips {
        display: none;
      }

      body.ready main.empty {
        justify-content: center;
      }
      body.ready main.empty #messages {
        display: none;
      }
      main.empty .chip {
        font-size: 0.88rem;
        padding: 0.45rem 0.95rem;
      }
      #chips {
        max-width: 820px;
        margin: 1rem auto 0;
      }

      .msg {
        animation: fadein 0.25s ease-out;
      }
      @keyframes fadein {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      .typing {
        display: inline-flex;
        gap: 0.3rem;
        padding: 0.35rem 0;
      }
      .typing i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        animation: bounce 1.2s infinite ease-in-out;
      }
      .typing i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        30% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }

      .codeblock {
        position: relative;
      }
      .codeblock pre {
        padding-top: 2rem;
      }
      .copy {
        position: absolute;
        top: 0.4rem;
        right: 0.4rem;
        padding: 0.2rem 0.6rem;
        font-size: 0.72rem;
        font-weight: 600;
        background: var(--surface);
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .copy:hover:not(:disabled) {
        background: var(--accent-soft);
        color: var(--accent);
      }

      :root {
        color-scheme: light dark;
      }

      body.ready #messages {
        max-width: none;
        margin: 0;
        padding: 1.5rem max(1rem, calc((100% - 820px) / 2));
      }

      #messages,
      aside,
      pre {
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }
      #messages::-webkit-scrollbar {
        width: 10px;
      }
      #messages::-webkit-scrollbar-track {
        background: transparent;
      }
      #messages::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 999px;
        border: 2px solid var(--bg);
      }
      #messages::-webkit-scrollbar-thumb:hover {
        background: var(--muted);
      }

      body.ready {
        grid-template-columns: 300px minmax(0, 1fr) !important;
        width: 100%;
      }
      body.ready main {
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        contain: inline-size; /* ignore children's width when sizing the column */
      }
      body.ready #messages {
        min-width: 0;
        max-width: 100%;
      }
      .msg,
      .sources,
      .sources details {
        min-width: 0;
        max-width: 100%;
      }

      /* long lines (like badge URLs) wrap instead of scrolling sideways */
      .sources pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        overflow-x: hidden;
      }

      @media (max-width: 760px) {
        body.ready {
          grid-template-columns: minmax(0, 1fr) !important;
        }
      }

      #messages {
        gap: 1.4rem;
      }
      .msg.bot {
        max-width: 100%;
        align-self: stretch;
        background: none;
        border: 0;
        border-radius: 0;
        padding: 0;
      }
      .msg.bot p {
        margin: 0.5rem 0;
      }
      .msg.bot ul {
        margin: 0.5rem 0;
        padding-left: 1.3rem;
      }
      .msg.bot li {
        margin: 0.35rem 0;
      }

      /* subtle citation pills */
      .cite {
        vertical-align: baseline;
        position: relative;
        top: -0.1em;
        font-size: 0.7rem;
        padding: 0.05rem 0.4rem;
        margin: 0 0.15rem;
        opacity: 0.8;
        cursor: pointer;
      }
      .cite:hover {
        opacity: 1;
        background: var(--accent);
        color: #fff;
      }

      /* compact sources */
      .sources {
        margin-top: 1rem;
        padding-top: 0;
        border-top: 0;
        font-size: 0.85rem;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.35rem;
      }
      .sources-title {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 600;
        cursor: default;
      }
      .source-row {
        display: flex;
        align-items: center;
        max-width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }
      .source-row:hover {
        border-color: var(--accent);
      }
      .sources .src-main {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        align-items: baseline;
        padding: 0.3rem 0.3rem 0.3rem 0.65rem;
        min-width: 0;
        color: var(--text);
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      .src-main .lines {
        color: var(--muted);
        white-space: nowrap;
      }
      .sources .src-gh {
        padding: 0.3rem 0.65rem 0.3rem 0.3rem;
        color: var(--muted);
        text-decoration: none;
      }
      .sources .src-gh:hover {
        color: var(--accent);
        text-decoration: none;
      }

      /* source viewer modal */
      .modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        padding: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
      }
      .modal[hidden] {
        display: none;
      }
      .modal-card {
        width: min(760px, 100%);
        max-height: 85dvh;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.8rem 1rem;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .modal-head small {
        display: block;
        font-weight: 400;
        color: var(--muted);
      }
      .icon-btn {
        padding: 0.2rem 0.6rem;
        font-size: 1.4rem;
        line-height: 1;
        background: none;
        color: var(--muted);
      }
      .icon-btn:hover:not(:disabled) {
        background: var(--accent-soft);
        color: var(--text);
      }
      .modal-body {
        overflow: auto;
        padding: 0.75rem 0;
        background: var(--code-bg);
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 0.8rem;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }
      .code-inner {
        width: max-content;
        min-width: 100%;
      }
      .code-line {
        display: flex;
        white-space: pre;
        padding-right: 1.5rem;
      }
      .code-line .num {
        flex: none;
        width: 3.2rem;
        padding-right: 0.9rem;
        text-align: right;
        color: var(--muted);
        user-select: none;
        position: sticky;
        left: 0;
        background: var(--code-bg);
      }
      .modal-foot {
        padding: 0.7rem 1rem;
        border-top: 1px solid var(--border);
      }
      .modal-foot a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      .modal-foot a:hover {
        text-decoration: underline;
      }
      body.ready .modal {
        left: 300px;
      }
      @media (max-width: 760px) {
        body.ready .modal {
          left: 0;
        }
      }

      body.ready #messages {
        padding-bottom: 2rem;
        scroll-padding-bottom: 2rem;
      }

      .msg {
        scroll-margin-top: 1rem;
      }

      .ghost {
        width: 100%;
        margin-top: 0.75rem;
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        font-weight: 500;
      }
      .ghost:hover:not(:disabled) {
        background: var(--accent-soft);
      }

      @media (max-width: 760px) {
        input {
          font-size: 16px;
        } /* stops iOS from zooming on focus */

        /* landing page */
        body.landing {
          padding: 1rem;
        }
        body.landing aside {
          gap: 1.5rem;
        }
        body.landing .brand {
          font-size: 1.9rem;
        }
        body.landing #uploadCard {
          padding: 1.1rem;
        }
        body.landing .row {
          flex-direction: column;
        }
        body.landing .row button {
          width: 100%;
        }

        /* chat area */
        body.ready #messages {
          padding: 1rem 0.9rem 2rem;
        }
        .composer {
          padding: 0 0.6rem 0.6rem;
        }
        .composer .row {
          padding: 0.5rem;
          border-radius: 16px;
        }
        main.empty .chip {
          font-size: 0.8rem;
          padding: 0.4rem 0.8rem;
        }

        /* source modal */
        .modal {
          padding: 0.5rem;
        }

      .topbar,

      @media (max-width: 760px) {

    </style>
  </head>

  <body class="landing">
    <aside>
      <svg class="gh-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path
          fill="currentColor"
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
        />
      </svg>
      <div class="brand">
        Chat with a GitHub <span class="brand-break">Repo</span>
      </div>
      <p class="tagline">
        Ask questions about any public GitHub repository with citations.
      </p>

      <div id="uploadCard" class="card">
        <div class="row">
          <input id="url" placeholder="https://github.com/owner/repo" />
          <button id="indexBtn">Index</button>
        </div>
        <ol id="stepper" class="stepper" hidden>
          <li><span class="dot"></span>Cloning</li>
          <li><span class="dot"></span>Indexing</li>
          <li><span class="dot"></span>Ready</li>
        </ol>
        <div id="status"></div>
      </div>

      <ul class="features">
        <li>Source citations</li>
        <li>Exact file references</li>
        <li>Repository-aware answers</li>
      </ul>

      <div id="repoInfo" class="card">
        <div class="info-label">Indexed repo</div>
        <a id="repoName" target="_blank" rel="noopener"></a>
        <div id="repoMeta"></div>
        <button id="newChatBtn" class="ghost">+ New chat</button>
      </div>
    </aside>

    <main id="chat" class="empty">
      <div id="messages"></div>
      <div class="composer">
        <div class="row">
          <input id="question" placeholder="Ask about the code..." />
          <button id="askBtn">Ask</button>
        </div>
        <div id="chips" class="chips"></div>
      </div>
    </main>

    <div class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Open menu">
        &#9776;
      </button>
      <span id="topName"></span>
    </div>
    <div id="backdrop"></div>

    <div id="srcModal" class="modal" hidden>
      <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="srcTitle"
      >
        <div class="modal-head">
          <div>
            <div id="srcTitle"></div>
            <small id="srcLines"></small>
          </div>
          <button id="srcClose" class="icon-btn" aria-label="Close">
            &times;
          </button>
        </div>
        <div id="srcBody" class="modal-body"></div>
        <div class="modal-foot">
          <a id="srcGh" target="_blank" rel="noopener"
            >Open on GitHub &#8599;</a
          >
        </div>
      </div>
    </div>

    <script>
      let repo = null; // {id, url, ...} once ready
      let history = []; // last turns sent with each question
      const $ = (id) => document.getElementById(id);
      function setMode(mode) {
        const apply = () => {
          document.body.className = mode;
        };
        if (document.startViewTransition)
          document.startViewTransition(apply); // smooth move
        else apply();
      }

      function showRepoInfo(r) {
        const name = r.url
          .replace(/\.git$/, "")
          .replace(/\/$/, "")
          .split("/")
          .slice(-2)
          .join("/");
        $("repoName").textContent = name;
        $("repoName").href = r.url;
        $("repoMeta").textContent = `${r.chunk_count} chunks indexed`;
        $("topName").textContent = name;
        $("question").placeholder = `Ask about ${name}...`;
        document.title = `${name} · Repo Chat`;
      }
      const STEPS = ["cloning", "indexing", "ready"];
      let lastStage = "cloning";

      function setDrawer(open) {
        document.body.classList.toggle("drawer-open", open);
      }
      $("menuBtn").onclick = () => setDrawer(true);
      $("backdrop").onclick = () => setDrawer(false);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") setDrawer(false);
      });

      function setStepper(status) {
        if (STEPS.includes(status)) lastStage = status;
        const idx = STEPS.indexOf(lastStage);
        document.querySelectorAll("#stepper li").forEach((li, i) => {
          li.className =
            status === "failed" && i === idx
              ? "error"
              : status === "ready" || i < idx
                ? "done"
                : i === idx
                  ? "active"
                  : "";
        });
        $("stepper").hidden = false;
      }

      const STARTERS = [
        "What does this project do?",
        "Where is the main entry point?",
        "How are errors handled?",
        "How is the code organized?",
      ];

      function showChips() {
        const box = $("chips");
        box.textContent = "";
        for (const q of STARTERS) {
          const b = document.createElement("button");
          b.className = "chip";
          b.textContent = q;
          b.onclick = () => {
            $("question").value = q;
            ask();
          };
          box.appendChild(b);
        }
      }

      function newChat() {
        if ($("askBtn").disabled) return; // an answer is still loading
        history = [];
        $("messages").textContent = "";
        $("question").value = "";
        showChips();
        const go = () => $("chat").classList.add("empty");
        document.startViewTransition ? document.startViewTransition(go) : go();
        $("question").focus();
        setDrawer(false);
      }
      $("newChatBtn").onclick = newChat;

      function setStatus(text, cls = "") {
        $("status").textContent = text;
        $("status").className = cls;
      }
      function friendlyError(raw) {
        console.error("indexing error:", raw); // raw detail stays in the console for debugging
        const msg = typeof raw === "string" ? raw : "";
        const e = msg.toLowerCase();
        if (e.includes("git clone failed") || e.includes("fatal:")) {
          if (e.includes("not found"))
            return "Repository not found. Check the URL and make sure the repo is public.";
          if (e.includes("timed out") || e.includes("timeout"))
            return "Cloning took too long. The repo may be too large, try a smaller one.";
          return "Couldn't clone this repository. Check the URL and try again.";
        }
        return msg && msg.length < 160
          ? msg
          : "Something went wrong. Please try again.";
      }

      async function startIndexing() {
        const url = $("url").value.trim();
        if (!url) return;
        $("indexBtn").disabled = true;
        lastStage = "cloning";
        setStepper("cloning");
        setStatus("");
        const res = await fetch("/repos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (!res.ok) {
          $("stepper").hidden = true;
          setStatus(friendlyError(data.detail), "failed");
          $("indexBtn").disabled = false;
          return;
        }
        pollStatus(data.repo_id);
      }

      async function pollStatus(id) {
        const r = await (await fetch(`/repos/${id}`)).json();
        if (r.status === "ready") {
          setStepper("ready");
          await new Promise((res) => setTimeout(res, 600)); // let all 3 ticks show
          repo = r;
          history = [];
          setStatus("");
          $("messages").textContent = "";
          showChips();
          $("chat").classList.add("empty");
          showRepoInfo(r);
          setMode("ready");
          $("stepper").hidden = true;
          $("question").focus();
          $("indexBtn").disabled = false;
        } else if (r.status === "failed") {
          setStepper("failed");
          setStatus(friendlyError(r.error), "failed");
          $("indexBtn").disabled = false;
        } else {
          setStepper(r.status);
          setTimeout(() => pollStatus(id), 1500);
        }
      }

      $("indexBtn").onclick = startIndexing;
      $("url").addEventListener("keydown", (e) => {
        if (e.key === "Enter") startIndexing();
      });

      function addMessage(text, cls) {
        const div = document.createElement("div");
        div.className = `msg ${cls}`;
        div.textContent = text;
        $("messages").appendChild(div);
        return div;
      }

      function githubLink(s) {
        const base = repo.url.replace(/\.git$/, "").replace(/\/$/, "");
        const safePath = s.path.split("/").map(encodeURIComponent).join("/");
        const rendered = /\.(md|markdown|mdx|rst|adoc)$/i.test(s.path);
        return `${base}/blob/HEAD/${safePath}${rendered ? "?plain=1" : ""}#L${s.start}-L${s.end}`;
      }

      function escapeHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function codeBlock(code) {
        return `<div class="codeblock"><button class="copy">Copy</button><pre>${escapeHtml(code)}</pre></div>`;
      }

      async function copyText(t) {
        if (navigator.clipboard && window.isSecureContext)
          return navigator.clipboard.writeText(t);
        const ta = document.createElement("textarea"); // fallback for plain-http pages
        ta.value = t;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }

      $("messages").addEventListener("click", async (e) => {
        const btn = e.target.closest(".copy");
        if (!btn) return;
        try {
          await copyText(btn.parentElement.querySelector("pre").textContent);
          btn.textContent = "Copied";
        } catch {
          btn.textContent = "Failed";
        }
        setTimeout(() => (btn.textContent = "Copy"), 1500);
      });

      function renderInline(text, sources) {
        let h = escapeHtml(text);
        h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
        h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        return h.replace(/\[(\d+)\]/g, (m, n) => {
          const s = sources.find((x) => x.id === Number(n));
          if (!s) return m;
          return `<a class="cite" href="${githubLink(s)}" data-src="${n}" target="_blank" rel="noopener" title="${escapeHtml(s.path)}:${s.start}-${s.end}">${n}</a>`;
        });
      }

      function renderAnswer(text, sources) {
        let html = "",
          inList = false,
          inCode = false,
          code = [];
        for (const line of text.split("\n")) {
          if (line.trim().startsWith("```")) {
            if (inList) {
              html += "</ul>";
              inList = false;
            }
            if (inCode) {
              html += codeBlock(code.join("\n"));
              code = [];
            }
            inCode = !inCode;
            continue;
          }
          if (inCode) {
            code.push(line);
            continue;
          }
          const m = line.match(/^\s*[*-]\s+(.*)/);
          if (m) {
            if (!inList) {
              html += "<ul>";
              inList = true;
            }
            html += `<li>${renderInline(m[1], sources)}</li>`;
          } else {
            if (inList) {
              html += "</ul>";
              inList = false;
            }
            if (line.trim()) html += `<p>${renderInline(line, sources)}</p>`;
          }
        }
        if (inList) html += "</ul>";
        if (inCode) html += codeBlock(code.join("\n"));
        return html;
      }

      const ICONS = {
        py: "🐍",
        js: "📜",
        ts: "📘",
        md: "📄",
        json: "🧾",
        yml: "⚙️",
        yaml: "⚙️",
        lua: "🌙",
        go: "🐹",
        java: "☕",
      };
      const fileIcon = (p) => ICONS[p.split(".").pop().toLowerCase()] || "📄";

      function addSources(msgDiv, sources) {
        if (!sources.length) return;
        msgDiv._sources = sources; // used by the click handler below
        const box = document.createElement("div");
        box.className = "sources";
        const title = document.createElement("div");
        title.className = "sources-title";
        title.textContent = "Sources";
        box.appendChild(title);
        for (const s of sources) {
          const row = document.createElement("div");
          row.className = "source-row";
          const main = document.createElement("a");
          main.className = "src-main";
          main.href = githubLink(s);
          main.dataset.src = s.id;
          main.title = "View source";
          main.innerHTML = `<span>${fileIcon(s.path)}</span><span>${escapeHtml(s.path)}</span><span class="lines">· Lines ${s.start}–${s.end}</span>`;
          const gh = document.createElement("a");
          gh.className = "src-gh";
          gh.href = githubLink(s);
          gh.target = "_blank";
          gh.rel = "noopener";
          gh.title = "Open on GitHub";
          gh.textContent = "↗";
          row.append(main, gh);
          box.appendChild(row);
        }
        msgDiv.appendChild(box);
      }

      function openSource(s) {
        $("srcTitle").textContent = s.path;
        $("srcLines").textContent = `Lines ${s.start}–${s.end}`;
        $("srcGh").href = githubLink(s);
        const body = $("srcBody");
        body.textContent = "";
        const inner = document.createElement("div");
        inner.className = "code-inner";
        s.snippet
          .replace(/\n$/, "")
          .split("\n")
          .forEach((line, i) => {
            const row = document.createElement("div");
            row.className = "code-line";
            const num = document.createElement("span");
            num.className = "num";
            num.textContent = s.start + i;
            const code = document.createElement("span");
            code.textContent = line || " ";
            row.append(num, code);
            inner.appendChild(row);
          });
        body.appendChild(inner);
        $("srcModal").hidden = false;
        $("srcClose").focus();
      }

      function closeSource() {
        $("srcModal").hidden = true;
      }

      $("srcClose").onclick = closeSource;
      $("srcModal").addEventListener("click", (e) => {
        if (e.target.id === "srcModal") closeSource();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeSource();
      });

      $("messages").addEventListener("click", (e) => {
        const link = e.target.closest("[data-src]");
        if (!link || e.ctrlKey || e.metaKey || e.shiftKey) return;
        const s = link
          .closest(".msg")
          ?._sources?.find((x) => x.id === Number(link.dataset.src));
        if (!s) return;
        e.preventDefault();
        openSource(s);
      });

      const smooth = () =>
        matchMedia("(prefers-reduced-motion: reduce)").matches
          ? "auto"
          : "smooth";

      function fitSpacer(userMsg) {
        const box = $("messages");
        let sp = $("spacer");
        if (!sp) {
          sp = document.createElement("div");
          sp.id = "spacer";
          sp.style.flex = "none";
        }
        sp.style.height = "0px";
        box.appendChild(sp); // always last
        const offset =
          parseFloat(getComputedStyle(userMsg).scrollMarginTop) || 0;
        const top =
          userMsg.getBoundingClientRect().top -
          box.getBoundingClientRect().top +
          box.scrollTop -
          offset;
        sp.style.height =
          Math.max(0, top + box.clientHeight - box.scrollHeight) + "px";
        return top;
      }

      async function ask() {
        const q = $("question").value.trim();
        if (!q || !repo || $("askBtn").disabled) return;
        $("question").value = "";
        $("askBtn").disabled = true;

        // first question: wait until the composer has finished moving down
        if ($("chat").classList.contains("empty")) {
          const go = () => {
            $("chat").classList.remove("empty");
            $("chips").textContent = "";
          };
          if (document.startViewTransition)
            await document.startViewTransition(go).finished;
          else go();
        }

        const userMsg = addMessage(q, "user");
        const reply = addMessage("", "bot");
        reply.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
        $("messages").scrollTo({ top: fitSpacer(userMsg), behavior: smooth() });

        try {
          const res = await fetch(`/repos/${repo.id}/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: q, history: history.slice(-6) }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail);
          reply.innerHTML = renderAnswer(data.answer, data.sources);
          history.push(
            { role: "user", content: q },
            { role: "assistant", content: data.answer.slice(0, 3000) },
          );
          addSources(reply, data.sources);
        } catch (e) {
          reply.textContent = `Error: ${e.message}`;
        }
        reply.classList.remove("thinking");
        fitSpacer(userMsg); // spacer shrinks as the answer grows; no extra scrolling
        $("askBtn").disabled = false;
      }

      $("askBtn").onclick = ask;
      $("question").addEventListener("keydown", (e) => {
        if (e.key === "Enter") ask();
      });
    </script>
  </body>
</html>
